name: Update Housing Data Table

on:
  schedule:
    # Runs on the 15th of January, April, July, and October at 6:00 AM UTC
    - cron: '0 6 15 1,4,7,10 *'
  workflow_dispatch: # Allows manual trigger from GitHub interface

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            quantmod
            xts
            dplyr
            tidyr
            knitr

      - name: Run R script
        run: Rscript update_mi_house_price_index.r

      - name: Commit and push changes if table updated
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add housing_table.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update quarterly housing table" && git push)
